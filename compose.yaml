services:
  payment-db:
    image: mongo:8.0
    container_name: ${DB_CONTAINER_NAME:-payment-db}

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}

    ports:
      - "${DB_PORT:-27018}:27017"

    volumes:
      - payment-db-data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${DB_USERNAME}",
          "--password",
          "${DB_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  kafka:
    image: apache/kafka:4.0.0
    container_name: ${KAFKA_CONTAINER_NAME:-payment-kafka}

    ports:
      - "${KAFKA_PORT:-9092}:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-topics.sh",
          "--bootstrap-server",
          "localhost:29092",
          "--list"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  payment-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${PAYMENT_SERVICE_CONTAINER_NAME:-payment-service}

    ports:
      - "${PAYMENT_SERVICE_PORT:-8085}:8080"

    environment:
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: payment-db
      DB_PORT: 27017

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_EVENTS_TOPIC: ${PAYMENT_EVENTS_TOPIC:-payment-events}

      RANDOM_ORG_BASE_URL: ${RANDOM_ORG_BASE_URL:-https://www.random.org}
      RANDOM_ORG_TIMEOUT_MS: ${RANDOM_ORG_TIMEOUT_MS:-5000}

    depends_on:
      payment-db:
        condition: service_healthy

      kafka:
        condition: service_healthy


volumes:
  payment-db-data: