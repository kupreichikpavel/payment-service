databaseChangeLog:
  - changeSet:
      id: 001-create-payments-collection
      author: alexey
      changes:
        - createCollection:
            collectionName: payments

        - createIndex:
            collectionName: payments
            keys: '{ order_id: 1 }'
            options: '{ name: "idx_payments_order_id" }'

        - createIndex:
            collectionName: payments
            keys: '{ user_id: 1 }'
            options: '{ name: "idx_payments_user_id" }'

        - createIndex:
            collectionName: payments
            keys: '{ status: 1 }'
            options: '{ name: "idx_payments_status" }'

        - createIndex:
            collectionName: payments
            keys: '{ timestamp: 1 }'
            options: '{ name: "idx_payments_timestamp" }'